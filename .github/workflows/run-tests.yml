name: Rodar Testes de API

# Define quando o pipeline vai rodar
on:
  # Roda a cada push na branch 'dev' (após o merge)
  push:
    branches:
      - dev
  # Roda a cada Pull Request que tenha a 'dev' como base
  pull_request:
    branches:
      - dev

jobs:
  test-api:
    # A máquina virtual que o GitHub vai usar
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o seu código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Ou a versão que você usa

      # 3. Instala as dependências
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Roda os testes de API!
      - name: Rodar testes de API (Robot Framework)
        run: robot --outputdir results --noncritical fail-on-skipped -i API tests/

      # 5. (Opcional) Sobe os relatórios
      - name: Arquivar relatórios de teste
        # Isso só roda se o passo anterior falhar
        if: ${{ always() }} 
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-reports
          path: results/